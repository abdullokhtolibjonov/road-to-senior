name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run: Actions → CI → Run workflow. Push/PR runs have no inputs → everything runs.
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite/project to run (e2e = chromium + firefox)
        type: choice
        options: [all, api, e2e, e2e-chromium, e2e-firefox]
        default: all
      tag:
        description: 'Only tests matching this tag/regex, e.g. @smoke or @cart|@checkout (empty = all)'
        type: string
        default: ''

# A new commit on the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fastest gate: no browsers, no network. The test jobs wait for it (`needs`).
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm                # caches ~/.npm keyed on package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  api:
    needs: lint-and-typecheck
    # On push/PR `inputs.suite` is empty, so this is true.
    if: ${{ !startsWith(inputs.suite, 'e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # No browser install: the api project only uses the `request` fixture.
      # The tag goes through an env var, never ${{ }} inside the script (no shell injection), and
      # stays one quoted argument. --pass-with-no-tests: a tag like @cart matches nothing here.
      - run: |
          if [ -n "$TAG" ]; then set -- --grep "$TAG" --pass-with-no-tests; fi
          npx playwright test --project=api "$@"
        env:
          TAG: ${{ inputs.tag }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}     # upload even when tests failed — that's when you need it
        with:
          name: api-report
          path: |
            playwright-report/
            results/junit.xml
          retention-days: 14

  e2e:
    needs: lint-and-typecheck
    if: ${{ inputs.suite != 'api' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false              # let firefox finish even if chromium fails
      matrix:
        # e2e-chromium / e2e-firefox → one browser; anything else (push, PR, all, e2e) → both.
        project: ${{ fromJSON(inputs.suite == 'e2e-chromium' && '["chromium"]' || inputs.suite == 'e2e-firefox' && '["firefox"]' || '["chromium", "firefox"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Browsers aren't cached: Playwright advises against it (restore ≈ download time,
      # and the OS dependencies from --with-deps can't be cached anyway).
      - name: Install ${{ matrix.project }} + OS dependencies
        run: npx playwright install --with-deps ${{ matrix.project }}
      # The `setup` project has no device → it logs in with Playwright's default browser
      # (chromium), even in the firefox job. The headless shell is enough for that.
      - name: Install chromium headless shell for the setup project
        if: ${{ matrix.project != 'chromium' }}
        run: npx playwright install --with-deps --only-shell chromium
      # `setup` (login → storageState) runs first via the project's `dependencies`.
      # `setup` still runs with --grep (dependencies aren't filtered), so tagged tests stay logged in.
      - run: |
          if [ -n "$TAG" ]; then set -- --grep "$TAG" --pass-with-no-tests; fi
          npx playwright test --project="$PROJECT" "$@"
        env:
          TAG: ${{ inputs.tag }}
          PROJECT: ${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
            results/junit.xml
          retention-days: 14
